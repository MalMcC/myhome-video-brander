<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyHome Video Brander</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: #1e293b; border-radius: 16px; padding: 40px; width: 100%; max-width: 560px; box-shadow: 0 25px 50px rgba(0,0,0,0.4); }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; color: #f97316; }
    .sub { font-size: 14px; color: #94a3b8; margin-bottom: 32px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
    input[type=text], input[type=url] { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px 14px; color: #f1f5f9; font-size: 15px; margin-bottom: 20px; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: #f97316; }
    .vip-preview { font-size: 13px; color: #f97316; margin-top: -14px; margin-bottom: 20px; display: none; }
    .upload-zone { border: 2px dashed #334155; border-radius: 12px; padding: 32px; text-align: center; cursor: pointer; margin-bottom: 20px; transition: all 0.2s; }
    .upload-zone:hover, .upload-zone.active { border-color: #f97316; background: rgba(249,115,22,0.05); }
    .upload-zone p { font-size: 14px; color: #64748b; margin-top: 8px; }
    .upload-zone .icon { font-size: 36px; }
    #logo-preview { max-width: 160px; max-height: 80px; margin: 12px auto 0; display: none; border-radius: 8px; background: white; padding: 8px; }
    button.primary { width: 100%; background: #f97316; color: white; border: none; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button.primary:hover:not(:disabled) { background: #ea6c0a; }
    button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { margin-top: 24px; padding: 20px; background: #0f172a; border-radius: 10px; display: none; }
    .status.visible { display: block; }
    .status-label { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; }
    .status-label.processing { color: #f59e0b; }
    .status-label.done { color: #22c55e; }
    .status-label.error { color: #ef4444; }
    .progress-bar { height: 4px; background: #1e293b; border-radius: 2px; margin: 12px 0; overflow: hidden; }
    .progress-fill { height: 100%; background: #f97316; border-radius: 2px; transition: width 0.3s; animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
    .results { display: none; margin-top: 24px; gap: 16px; grid-template-columns: 1fr 1fr; }
    .results.visible { display: grid; }
    .variant-card { background: #0f172a; border-radius: 12px; overflow: hidden; border: 1px solid #1e293b; }
    .variant-thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #1e293b; }
    .variant-thumb.loading { background: #1e293b; min-height: 100px; }
    .variant-info { padding: 12px; }
    .variant-label { font-size: 13px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
    .dl-btn { display: block; text-align: center; background: #f97316; color: white; padding: 10px 16px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px; transition: background 0.2s; }
    .dl-btn:hover { background: #ea6c0a; }
    .status-msg { font-size: 13px; color: #64748b; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎬 MyHome Video Brander</h1>
    <p class="sub">Generates both Rural and Urban branded videos for your agent.</p>

    <label>Agent Name</label>
    <input type="text" id="agentName" placeholder="e.g. Kelvin Francis" />

    <label>Agent Website URL</label>
    <input type="url" id="agentUrl" placeholder="e.g. https://kelvinfrancis.com" />
    <div class="vip-preview" id="vipPreview">QR code → <strong id="vipPreviewUrl"></strong></div>

    <label>Agent Logo</label>
    <div class="upload-zone" id="uploadZone">
      <div class="icon">🏠</div>
      <p>Click to upload logo (PNG or SVG, transparent background ideal)</p>
      <img id="logo-preview" />
    </div>
    <input type="file" id="logoInput" accept="image/*" style="display:none" />

    <button class="primary" id="generateBtn" disabled>Generate Branded Videos →</button>

    <div class="status" id="statusBox">
      <div class="status-label processing" id="statusLabel">Processing...</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:15%"></div></div>
      <div class="status-msg" id="statusMsg">Generating both Rural and Urban videos — takes about 3–4 minutes.</div>
    </div>

    <div class="results" id="results">
      <div class="variant-card" id="card-rural">
        <img class="variant-thumb loading" id="thumb-rural" />
        <div class="variant-info">
          <div class="variant-label">🌿 Rural</div>
          <a class="dl-btn" id="dl-rural" href="#">⬇️ Download Rural</a>
        </div>
      </div>
      <div class="variant-card" id="card-urban">
        <img class="variant-thumb loading" id="thumb-urban" />
        <div class="variant-info">
          <div class="variant-label">🏙️ Urban</div>
          <a class="dl-btn" id="dl-urban" href="#">⬇️ Download Urban</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const agentNameEl = document.getElementById('agentName');
    const agentUrlEl  = document.getElementById('agentUrl');
    const logoInput   = document.getElementById('logoInput');
    const uploadZone  = document.getElementById('uploadZone');
    const logoPreview = document.getElementById('logo-preview');
    const generateBtn = document.getElementById('generateBtn');
    const statusBox   = document.getElementById('statusBox');
    const statusLabel = document.getElementById('statusLabel');
    const progressFill= document.getElementById('progressFill');
    const statusMsg   = document.getElementById('statusMsg');
    const resultsEl   = document.getElementById('results');
    let logoFile = null;

    uploadZone.addEventListener('click', () => logoInput.click());
    logoInput.addEventListener('change', e => {
      logoFile = e.target.files[0];
      if (logoFile) {
        const reader = new FileReader();
        reader.onload = ev => { logoPreview.src = ev.target.result; logoPreview.style.display = 'block'; };
        reader.readAsDataURL(logoFile);
        checkReady();
      }
    });

    agentNameEl.addEventListener('input', checkReady);
    agentUrlEl.addEventListener('input', () => { updateVipPreview(); checkReady(); });

    function deriveSlug(url) {
      try {
        const u = url.startsWith('http') ? url : 'https://' + url;
        return new URL(u).hostname.replace(/^www\./, '').split('.')[0].toLowerCase();
      } catch(e) {
        return url.replace(/^https?:\/\//, '').replace(/^www\./, '').split('.')[0].toLowerCase();
      }
    }

    function updateVipPreview() {
      const v = agentUrlEl.value.trim();
      const preview = document.getElementById('vipPreview');
      if (v) {
        document.getElementById('vipPreviewUrl').textContent = `vip.myporta.ai/${deriveSlug(v)}`;
        preview.style.display = 'block';
      } else {
        preview.style.display = 'none';
      }
    }

    function checkReady() {
      generateBtn.disabled = !(agentNameEl.value.trim() && agentUrlEl.value.trim() && logoFile);
    }

    generateBtn.addEventListener('click', async () => {
      generateBtn.disabled = true;
      resultsEl.classList.remove('visible');
      statusBox.className = 'status visible';
      statusLabel.className = 'status-label processing';
      statusLabel.textContent = 'Processing...';
      progressFill.style.width = '15%';
      progressFill.style.animation = 'pulse 1.5s ease-in-out infinite';
      statusMsg.textContent = 'Generating both Rural and Urban videos — takes about 3–4 minutes.';

      const fd = new FormData();
      fd.append('logo', logoFile);
      fd.append('agentName', agentNameEl.value.trim());
      fd.append('agentUrl', agentUrlEl.value.trim());

      const resp = await fetch('/brand', { method: 'POST', body: fd });
      const { jobId, error } = await resp.json();
      if (error) { showError(error); return; }

      progressFill.style.width = '30%';
      poll(jobId);
    });

    function poll(jobId) {
      const interval = setInterval(async () => {
        const resp = await fetch(`/status/${jobId}`);
        const job = await resp.json();
        if (job.status === 'done') {
          clearInterval(interval);
          progressFill.style.width = '100%';
          progressFill.style.animation = 'none';
          statusLabel.className = 'status-label done';
          statusLabel.textContent = '✅ Both videos ready!';
          statusMsg.textContent = '';

          // Wire up download links and thumbnails
          document.getElementById('dl-rural').href = job.variants.rural.downloadUrl;
          document.getElementById('dl-urban').href = job.variants.urban.downloadUrl;
          document.getElementById('thumb-rural').src = job.variants.rural.thumbUrl + '?t=' + Date.now();
          document.getElementById('thumb-urban').src = job.variants.urban.thumbUrl + '?t=' + Date.now();
          document.getElementById('thumb-rural').classList.remove('loading');
          document.getElementById('thumb-urban').classList.remove('loading');

          resultsEl.classList.add('visible');
          generateBtn.disabled = false;
        } else if (job.status === 'error') {
          clearInterval(interval);
          showError(job.error);
        } else {
          progressFill.style.width = '65%';
        }
      }, 4000);
    }

    function showError(msg) {
      statusLabel.className = 'status-label error';
      statusLabel.textContent = '❌ Error';
      statusMsg.textContent = msg;
      generateBtn.disabled = false;
    }
  </script>
</body>
</html>
